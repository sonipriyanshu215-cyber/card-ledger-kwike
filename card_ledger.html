    const FIELDS = ["Name", "Company", "Title", "Phone", "Email", "Address", "Website"];
    const MAX_DIM = 1500;
    const CONCURRENCY = 3;
    const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);

    // ── IndexedDB helpers for persisting the file handle across reloads ──
    function openMetaDB() {
      return new Promise((res, rej) => {
        const req = indexedDB.open("CardLedgerMeta", 1);
        req.onupgradeneeded = e => e.target.result.createObjectStore("meta");
        req.onsuccess = e => res(e.target.result);
        req.onerror = () => rej(req.error);
      });
    }
    async function dbPut(key, val) {
      const db = await openMetaDB();
      return new Promise((res, rej) => {
        const tx = db.transaction("meta", "readwrite");
        tx.objectStore("meta").put(val, key);
        tx.oncomplete = res; tx.onerror = () => rej(tx.error);
      });
    }
    async function dbGet(key) {
      const db = await openMetaDB();
      return new Promise((res, rej) => {
        const tx = db.transaction("meta", "readonly");
        const req = tx.objectStore("meta").get(key);
        req.onsuccess = () => res(req.result); req.onerror = () => rej(req.error);
      });
    }

    // ── xlsx helpers ──
    function cardsToWorkbook(cards) {
      const rows = cards.map(c => { const o = {}; FIELDS.forEach(f => (o[f] = c[f] || "")); return o; });
      const ws = XLSX.utils.json_to_sheet(rows, { header: FIELDS });
      ws["!cols"] = [{ wch: 22 }, { wch: 26 }, { wch: 22 }, { wch: 20 }, { wch: 26 }, { wch: 40 }, { wch: 26 }];
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Cards");
      return wb;
    }
    function workbookToCards(wb) {
      const ws = wb.Sheets[wb.SheetNames[0]];
      if (!ws) return [];
      return XLSX.utils.sheet_to_json(ws, { defval: "" })
        .map(row => {
          const o = { id: uid(), thumb: null, status: "done" };
          FIELDS.forEach(f => (o[f] = (row[f] ?? "").toString().trim()));
          return o;
        })
        .filter(o => FIELDS.some(f => o[f]));
    }

    // ── image resize ──
    function resizeImage(file) {
      return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => {
          let { width: w, height: h } = img;
          const scale = Math.min(1, MAX_DIM / Math.max(w, h));
          w = Math.round(w * scale); h = Math.round(h * scale);
          const canvas = document.createElement("canvas");
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext("2d");
          ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, w, h);
          ctx.drawImage(img, 0, 0, w, h);
          URL.revokeObjectURL(url);
          const dataUrl = canvas.toDataURL("image/jpeg", 0.85);
          resolve({ dataUrl, base64: dataUrl.split(",")[1], mediaType: "image/jpeg" });
        };
        img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("Could not read image")); };
        img.src = url;
      });
    }

    const PROMPT = `You are extracting structured data from a business / visiting card image. Return ONLY a raw JSON object — no markdown, no code fences, no commentary — with exactly these keys: "Name", "Company", "Title", "Phone", "Email", "Address", "Website".
Rules:
- Use "" (empty string) for any field that is not present on the card.
- Name = the person's full name only.
- Title = job title / designation (e.g. "Co-Founder & CTO").
- Company = organisation name only; ignore taglines and slogans.
- Phone = every phone / mobile / tel number found, joined by "; ", keeping country codes and "+".
- Email = the email address.
- Website = website or domain; if it is a bare domain, prefix it with "https://".
- Address = the full postal address collapsed into one single line.
Respond with the JSON object and nothing else.`;

    async function extractCard(base64, mediaType, apiKey) {
      const res = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "x-api-key": apiKey,
          "anthropic-version": "2023-06-01",
          "anthropic-dangerous-direct-browser-access": "true",
        },
        body: JSON.stringify({
          model: "claude-haiku-4-5-20251001",
          max_tokens: 1000,
          messages: [{ role: "user", content: [
            { type: "image", source: { type: "base64", media_type: mediaType, data: base64 } },
            { type: "text", text: PROMPT },
          ]}],
        }),
      });
      if (!res.ok) {
        const body = await res.text().catch(() => "");
        throw new Error("API " + res.status + (body ? ": " + body.slice(0, 120) : ""));
      }
      const data = await res.json();
      const text = (data.content || []).filter(b => b.type === "text").map(b => b.text).join("\n");
      const clean = text.replace(/```json/gi, "").replace(/```/g, "").trim();
      let parsed;
      try { parsed = JSON.parse(clean); }
      catch {
        const m = clean.match(/\{[\s\S]*\}/);
        if (!m) throw new Error("Unparseable response");
        parsed = JSON.parse(m[0]);
      }
      const out = {};
      FIELDS.forEach(f => { out[f] = (parsed[f] ?? "").toString().trim(); });
      return out;
    }

    async function mapLimit(items, limit, worker) {
      let i = 0;
      await Promise.all(Array.from({ length: Math.min(limit, items.length) }, async () => {
        while (i < items.length) { const idx = i++; await worker(items[idx]); }
      }));
    }

    function CardLedger() {
      const [cards, setCards]       = useState([]);
      const [loaded, setLoaded]     = useState(false);
      const [over, setOver]         = useState(false);
      const [fileHandle, setFileHandle] = useState(null);
      const [fileName, setFileName] = useState(null);
      const [saveStatus, setSaveStatus] = useState(null); // 'saving'|'saved'|'error'
      const [apiKey, setApiKey]     = useState(() => localStorage.getItem("cl:apikey") || "");
      const batchRef  = useRef(null);
      const camRef    = useRef(null);
      const saveTimer = useRef(null);

      // ── restore file handle from IndexedDB on mount ──
      useEffect(() => {
        (async () => {
          try {
            const h = await dbGet("fileHandle");
            if (h) {
              // request permission silently; if denied user can re-open manually
              const perm = await h.queryPermission({ mode: "readwrite" });
              if (perm === "granted") {
                await loadFromHandle(h, false);
              } else {
                const req = await h.requestPermission({ mode: "readwrite" });
                if (req === "granted") await loadFromHandle(h, false);
              }
            }
          } catch (_) {}
          setLoaded(true);
        })();
      }, []);

      async function loadFromHandle(h, replaceCards = true) {
        const file = await h.getFile();
        const buf  = await file.arrayBuffer();
        const wb   = XLSX.read(buf);
        const imported = workbookToCards(wb);
        if (replaceCards) setCards(imported);
        setFileHandle(h);
        setFileName(h.name);
        await dbPut("fileHandle", h);
      }

      // ── auto-save whenever cards change (debounced 600 ms) ──
      useEffect(() => {
        if (!loaded || !fileHandle) return;
        clearTimeout(saveTimer.current);
        saveTimer.current = setTimeout(() => writeToFile(fileHandle, cards), 600);
        return () => clearTimeout(saveTimer.current);
      }, [cards, fileHandle, loaded]);

      async function writeToFile(h, data) {
        try {
          setSaveStatus("saving");
          const wb  = cardsToWorkbook(data);
          const buf = XLSX.write(wb, { type: "array", bookType: "xlsx" });
          const writable = await h.createWritable();
          await writable.write(new Uint8Array(buf));
          await writable.close();
          setSaveStatus("saved");
          setTimeout(() => setSaveStatus(null), 2000);
        } catch (e) {
          setSaveStatus("error");
        }
      }

      // ── open existing file ──
      async function openFile() {
        try {
          const [h] = await window.showOpenFilePicker({ ...XLSX_OPTS, multiple: false });
          await loadFromHandle(h, true);
        } catch (e) {
          if (e.name !== "AbortError") alert("Could not open file: " + e.message);
        }
      }

      // ── create new blank file ──
      async function newFile() {
        try {
          const h = await window.showSaveFilePicker({ ...XLSX_OPTS, suggestedName: "card_ledger.xlsx" });
          setCards([]);
          setFileHandle(h);
          setFileName(h.name);
          await dbPut("fileHandle", h);
          await writeToFile(h, []);
        } catch (e) {
          if (e.name !== "AbortError") alert("Could not create file: " + e.message);
        }
      }

      const patch = useCallback((id, p) =>
        setCards(prev => prev.map(c => c.id === id ? { ...c, ...p } : c)), []);

      const processFiles = useCallback(async (fileList) => {
        if (!apiKey.trim()) { alert("Enter your Anthropic API key first."); return; }
        if (!fileHandle)    { alert("Open or create a ledger file first."); return; }
        const files = Array.from(fileList).filter(f => f.type.startsWith("image/"));
        if (!files.length) return;
        const entries = [];
        for (const f of files) {
          try {
            const { dataUrl, base64, mediaType } = await resizeImage(f);
            entries.push({ id: uid(), thumb: dataUrl, base64, mediaType, status: "queued",
              Name:"", Company:"", Title:"", Phone:"", Email:"", Address:"", Website:"" });
          } catch (_) {}
        }
        setCards(prev => [...entries, ...prev]);
        await mapLimit(entries, CONCURRENCY, async (e) => {
          patch(e.id, { status: "processing" });
          try {
            const fields = await extractCard(e.base64, e.mediaType, apiKey.trim());
            patch(e.id, { ...fields, status: fields.Name ? "done" : "review", base64: undefined });
          } catch (err) {
            patch(e.id, { status: "error", _err: String(err.message || err), base64: undefined });
          }
        });
      }, [patch, apiKey, fileHandle]);

      const onDrop = useCallback((e) => {
        e.preventDefault(); setOver(false);
        if (e.dataTransfer.files?.length) processFiles(e.dataTransfer.files);
      }, [processFiles]);

      const saveApiKey = (k) => { setApiKey(k); localStorage.setItem("cl:apikey", k); };
      const hasKey = apiKey.trim().startsWith("sk-ant-");
      const reviewCount     = cards.filter(c => c.status === "review" || c.status === "error").length;
      const processingCount = cards.filter(c => c.status === "processing" || c.status === "queued").length;

      return (
        <div className="cl-root">
          <style>{css}</style>
          <div className="cl-wrap">

            <header className="cl-mast">
              <div>
                <h1 className="cl-title">Card <em>Ledger</em></h1>
                <div className="cl-sub">Vision-powered visiting-card capture — Excel</div>
              </div>
              <div className="cl-mark"><Crosshair size={15} strokeWidth={1.5} /> Auto-saves to your file</div>
            </header>

            {/* ── file setup / status ── */}
            {!fileHandle ? (
              <div className="cl-setup">
                <div className="t">Choose your ledger file</div>
                <div className="row">
                  <button className="cl-btn accent" onClick={newFile}>
                    <FilePlus size={15} /> New ledger file
                  </button>
                  <button className="cl-btn ghost" onClick={openFile}>
                    <FolderOpen size={15} /> Open existing .xlsx
                  </button>
                </div>
              </div>
            ) : (
              <div className="cl-filebar">
                <FileSpreadsheet size={15} style={{flexShrink:0, color:"var(--ok)"}} />
                <span className="fname" title={fileName}>{fileName}</span>
                {saveStatus === "saving" && <span className="badge badge-saving"><Loader2 size={10} className="spin" /> saving…</span>}
                {saveStatus === "saved"  && <span className="badge badge-saved">✓ saved</span>}
                {saveStatus === "error"  && <span className="badge badge-error">save failed</span>}
                <button className="switch" onClick={openFile}>switch file</button>
                <button className="switch" onClick={newFile}>new file</button>
              </div>
            )}

            {/* ── API key ── */}
            <div className="cl-apibar">
              <span className={"dot " + (hasKey ? "dot-ok" : "dot-no")} />
              <label htmlFor="apikey">Anthropic API Key</label>
              <input id="apikey" type="password" placeholder="sk-ant-api03-…"
                value={apiKey} onChange={e => saveApiKey(e.target.value)} spellCheck={false} />
              <span className="hint">{hasKey ? "Saved in browser" : "Required to scan cards"}</span>
            </div>

            {/* ── action buttons ── */}
            <div className="cl-bar">
              <button className="cl-btn" onClick={() => batchRef.current?.click()} disabled={!fileHandle}>
                <Upload size={15} /> Upload images
              </button>
              <button className="cl-btn ghost" onClick={() => camRef.current?.click()} disabled={!fileHandle}>
                <Camera size={15} /> Scan with camera
              </button>
              {cards.length > 0 && (
                <button className="cl-btn danger" onClick={() => {
                  if (confirm("Clear all cards from the ledger?")) setCards([]);
                }}>
                  <Eraser size={15} /> Clear all
                </button>
              )}
            </div>

            <input ref={batchRef} type="file" accept="image/*" multiple style={{display:"none"}}
              onChange={e => { processFiles(e.target.files); e.target.value = ""; }} />
            <input ref={camRef} type="file" accept="image/*" capture="environment" style={{display:"none"}}
              onChange={e => { processFiles(e.target.files); e.target.value = ""; }} />

            <div className={"cl-drop" + (over ? " over" : "")}
              onClick={() => fileHandle && batchRef.current?.click()}
              onDragOver={e => { e.preventDefault(); setOver(true); }}
              onDragLeave={() => setOver(false)}
              onDrop={onDrop}>
              <div className="cl-drop-t">Drop card photos here</div>
              <div className="cl-drop-s">one card per image · batch-drop a folder · jpg / png / heic</div>
            </div>

            <div className="cl-stats">
              <span><b>{cards.length}</b> cards</span>
              {processingCount > 0 && (
                <span><Loader2 size={11} className="spin" style={{verticalAlign:"-1px"}} /> <b>{processingCount}</b> scanning</span>
              )}
              {reviewCount > 0 && <span className="rev"><b>{reviewCount}</b> need review</span>}
            </div>

            <div className="cl-tablewrap">
              {cards.length === 0 ? (
                <div className="cl-empty">
                  <div className="ico"><ScanLine size={46} strokeWidth={1.2} /></div>
                  <div className="t">Your ledger is empty</div>
                  <div className="s">Upload or snap a card — fields fill themselves in and save automatically.</div>
                </div>
              ) : (
                <table className="cl-tbl">
                  <thead>
                    <tr>
                      <th></th>
                      <th>Status</th>
                      {FIELDS.map(f => <th key={f}>{f}</th>)}
                      <th></th>
                    </tr>
                  </thead>
                  <tbody>
                    {cards.map(c => {
                      const scanning = c.status === "processing" || c.status === "queued";
                      return (
                        <tr key={c.id}>
                          <td>
                            <div className={"cl-thumb" + (scanning ? " cl-scan" : "")}>
                              {c.thumb
                                ? <img src={c.thumb} alt="" />
                                : <span className="ph"><ScanLine size={15} /></span>}
                            </div>
                          </td>
                          <td>
                            <span className={"cl-statuscell s-" + c.status}>
                              <span className="cl-dot" />
                              {c.status === "done"       && "ok"}
                              {c.status === "review"     && "review"}
                              {c.status === "error"      && "error"}
                              {scanning && (c.status === "processing" ? "reading" : "queued")}
                            </span>
                            {c.status === "error" && <div className="cl-err-msg">{c._err}</div>}
                          </td>
                          {FIELDS.map(f => (
                            <td key={f} className={"cl-cell" + (f === "Name" ? " name" : "")}>
                              <input
                                value={c[f] || ""}
                                placeholder={scanning ? "…" : "—"}
                                onChange={e => patch(c.id, {
                                  [f]: e.target.value,
                                  status: c.status === "review" && f === "Name" && e.target.value ? "done" : c.status,
                                })}
                              />
                            </td>
                          ))}
                          <td>
                            <button className="cl-x" title="Remove"
                              onClick={() => setCards(prev => prev.filter(x => x.id !== c.id))}>
                              <X size={15} />
                            </button>
                          </td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              )}
            </div>

            <div className="cl-foot">
              Every scan, edit, and delete is written directly to <b>{fileName || "your ledger file"}</b> — no manual export needed.
              Click any cell to correct what the model missed.
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<CardLedger />);
  </script>
</body>
</html>
